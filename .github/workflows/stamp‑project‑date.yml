# .github/workflows/stamp-project-date.yml
name: Stamp Roadmap item with commit date

# ← Here, at the **top** of the file:
permissions:
  contents: read     # we still need to read the repo
  repository-projects: write    # now we get write access to Projects V2

on:
  push:               # or pull_request, etc.
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Grab the commit timestamp
      id: commit
      run: |
        DATE=$(git show -s --format=%cI ${{ github.sha }})
        echo "::set-output name=date::$DATE"

    - name: Lookup project & field IDs
      id: lookup
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const query = `
            query($user:String!,$projNum:Int!){
              user(login:$user) {
                projectV2(number:$projNum) {
                  id
                  fields(first:50) {
                    nodes {
                      __typename
                      ... on ProjectV2Field             { id name }
                      ... on ProjectV2IterationField    { id name }
                      ... on ProjectV2SingleSelectField { id name }
                    }
                  }
                }
              }
            }
          `;

          const resp = await github.graphql(query, {
            user:    context.repo.owner,   // glyjtha
            projNum: 3
          });

          const project = resp.user.projectV2;
          const field   = project.fields.nodes.find(f => f.name === "Last commit");
          if (!field) throw new Error("Couldn't find your Date field!");
          return {
            projectId: project.id,
            fieldId:   field.id
          };


    - name: Update the card's “Last commit” field
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GH_PAT }}

        script: |
          const itemId = context.payload.pull_request?.node_id 
                        || context.payload.issue?.node_id;
          if(!itemId) throw new Error("Can't find an item to stamp!");
          
          await github.graphql(`
            mutation($input:UpdateProjectV2ItemFieldValueInput!){
              updateProjectV2ItemFieldValue(input:$input){
                projectV2Item { id }
              }
            }`,
            {
              input: {
                projectId:  "${{ steps.lookup.outputs.projectId }}",
                itemId:     itemId,
                fieldId:    "${{ steps.lookup.outputs.fieldId }}",
                value:      JSON.stringify("${{ steps.commit.outputs.date }}")
              }
            }
          );
