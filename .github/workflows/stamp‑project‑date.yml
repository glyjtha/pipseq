name: Stamp Roadmap item with commit date
on:
  push:
jobs:
  stamp:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # to fetch the commit
      project: write       # to update your Project
    steps:
    - name: Grab the commit timestamp
      id: commit
      run: |
        # Get the ISO date of the HEAD commit
        DATE=$(git show -s --format=%cI ${{ github.sha }})
        echo "::set-output name=date::$DATE"

    - name: Lookup project & field IDs
      id: lookup
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const project     = await github.graphql(`
            query($owner:String!, $repo:String!, $projNum:Int!){
              repository(owner:$owner,name:$repo){
                projectV2(number:$projNum){
                  id
                  fields(first:50){
                    nodes { id name }
                  }
                }
              }
            }`,
            {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              projNum: 1
            }
          );
          const proj     = project.repository.projectV2;
          const field    = proj.fields.nodes.find(f=>f.name==="Last commit");
          return {
            projectId: proj.id,
            fieldId:   field.id
          };

    - name: Update the card’s “Last commit” field
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const itemId = context.payload.pull_request?.node_id 
                       || context.payload.issue?.node_id;
          if(!itemId) throw new Error("Can't find an item to stamp!");
          
          await github.graphql(`
            mutation($input:UpdateProjectV2ItemFieldValueInput!){
              updateProjectV2ItemFieldValue(input:$input){
                projectV2Item { id }
              }
            }`,
            {
              input: {
                projectId:  "${{ steps.lookup.outputs.projectId }}",
                itemId:     itemId,
                fieldId:    "${{ steps.lookup.outputs.fieldId }}",
                value:      JSON.stringify("${{ steps.commit.outputs.date }}")
              }
            }
          );
